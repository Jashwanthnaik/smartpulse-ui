<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPulse Banking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Hide scrollbar for clean app look */
        ::-webkit-scrollbar { display: none; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex justify-center items-center p-4 font-sans">

    <!-- Mobile App Container -->
    <div class="w-full max-w-md bg-slate-800 rounded-[2.5rem] shadow-2xl overflow-hidden border border-slate-700 relative h-[850px] flex flex-col">
        
        <!-- Header -->
        <div class="p-6 pb-2 shrink-0">
            <h1 class="text-2xl font-bold tracking-tight">SmartPulse</h1>
            <p class="text-slate-400 text-sm">Welcome back</p>
        </div>

        <!-- Scrollable Content Area -->
        <div class="flex-1 overflow-y-auto pb-24">
            
            <!-- HOME TAB -->
            <div id="tab-home" class="tab-content active p-6 space-y-6">
                <!-- Balance Card -->
                <div class="bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl p-6 shadow-lg relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-white/10 rounded-full -mr-10 -mt-10 blur-2xl"></div>
                    <p class="text-indigo-100 text-sm font-medium mb-1">Available Balance</p>
                    <h2 id="display-balance" class="text-4xl font-bold">$1,240.50</h2>
                </div>

                <!-- Savings Goal Widget -->
                <div class="bg-slate-700/50 rounded-2xl p-5 border border-slate-600">
                    <div class="flex justify-between items-center mb-3">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-plane-departure text-indigo-400"></i>
                            <h3 class="font-semibold">Spring Break Trip</h3>
                        </div>
                        <span id="roundup-badge" class="text-xs bg-indigo-500/20 text-indigo-300 px-2 py-1 rounded-full border border-indigo-500/30">Round-Ups Active</span>
                    </div>
                    <div class="w-full bg-slate-800 rounded-full h-3 mb-2 overflow-hidden border border-slate-600">
                        <div id="goal-progress" class="bg-gradient-to-r from-indigo-400 to-purple-400 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                    <p class="text-sm text-slate-400 flex justify-between">
                        <span id="goal-current" class="text-white font-medium">$0.00</span>
                        <span>Goal: $500.00</span>
                    </p>
                </div>

                <!-- Add Transaction -->
                <div>
                    <h3 class="font-semibold mb-3 text-slate-300 text-sm uppercase tracking-wider">Quick Add</h3>
                    <div class="flex gap-2">
                        <input type="number" id="expense-amount" placeholder="$ Amount" class="bg-slate-700 border border-slate-600 text-white text-sm rounded-xl px-3 py-3 w-full focus:outline-none focus:border-indigo-500 transition-colors">
                        <select id="expense-category" class="bg-slate-700 border border-slate-600 text-white text-sm rounded-xl px-3 py-3 focus:outline-none focus:border-indigo-500 transition-colors">
                            <option value="Food">🍔 Food</option>
                            <option value="Transport">🚗 Transit</option>
                            <option value="Shopping">🛍️ Shop</option>
                            <option value="Bills">📱 Bills</option>
                        </select>
                        <button onclick="addTransaction()" class="bg-indigo-500 hover:bg-indigo-600 text-white px-5 py-3 rounded-xl text-sm font-bold transition-colors shadow-lg shadow-indigo-500/30"><i class="fa-solid fa-plus"></i></button>
                    </div>
                </div>

                <!-- Recent Transactions Feed -->
                <div>
                    <h3 class="font-semibold mb-3 text-slate-300 text-sm uppercase tracking-wider">Recent Activity</h3>
                    <div id="transaction-list" class="space-y-3">
                        <!-- Transactions injected here -->
                    </div>
                </div>
            </div>

            <!-- ANALYTICS TAB -->
            <div id="tab-analytics" class="tab-content p-6 space-y-6">
                <div class="bg-slate-700/50 rounded-2xl p-5 border border-slate-600">
                    <h3 class="font-semibold mb-4 text-center">Spending Breakdown</h3>
                    <div class="relative h-48 w-full flex justify-center">
                        <canvas id="spendChart"></canvas>
                    </div>
                </div>
                
                <div id="category-list" class="space-y-3">
                    <!-- Category stats injected here -->
                </div>
            </div>

            <!-- SETTINGS TAB -->
            <div id="tab-settings" class="tab-content p-6 space-y-6">
                <h3 class="font-semibold text-xl mb-4">Settings & Features</h3>
                
                <div class="bg-slate-700/50 rounded-2xl p-5 border border-slate-600 space-y-4">
                    <div class="flex justify-between items-center">
                        <div>
                            <p class="font-medium">Spare Change Round-Ups</p>
                            <p class="text-xs text-slate-400">Round purchases to nearest $1</p>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="roundup-toggle" class="sr-only peer" onchange="toggleRoundups()">
                            <div class="w-11 h-6 bg-slate-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-500"></div>
                        </label>
                    </div>
                </div>

                <button onclick="resetData()" class="w-full bg-red-500/20 text-red-400 border border-red-500/50 py-3 rounded-xl font-medium hover:bg-red-500/30 transition-colors">
                    <i class="fa-solid fa-rotate-right mr-2"></i> Reset All App Data
                </button>
            </div>

        </div>

        <!-- Bottom Navigation Menu -->
        <div class="absolute bottom-0 w-full bg-slate-800/95 backdrop-blur-md border-t border-slate-700 flex justify-around py-4 pb-6 shrink-0 z-10">
            <button onclick="switchTab('home')" id="nav-home" class="nav-btn flex flex-col items-center text-indigo-400 transition-colors">
                <i class="fa-solid fa-house text-xl mb-1"></i>
                <span class="text-[10px] font-medium">Home</span>
            </button>
            <button onclick="switchTab('analytics')" id="nav-analytics" class="nav-btn flex flex-col items-center text-slate-500 hover:text-slate-300 transition-colors">
                <i class="fa-solid fa-chart-pie text-xl mb-1"></i>
                <span class="text-[10px] font-medium">Analytics</span>
            </button>
            <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn flex flex-col items-center text-slate-500 hover:text-slate-300 transition-colors">
                <i class="fa-solid fa-gear text-xl mb-1"></i>
                <span class="text-[10px] font-medium">Settings</span>
            </button>
        </div>
    </div>

    <script>
        // Default Starting State
        const defaultState = {
            balance: 1240.50,
            goalCurrent: 0.00,
            roundupsActive: true,
            transactions: []
        };

        let state = JSON.parse(localStorage.getItem('smartpulse_v2')) || defaultState;
        let spendChartInstance = null;

        const catColors = { 'Food': '#8b5cf6', 'Transport': '#3b82f6', 'Shopping': '#ec4899', 'Bills': '#f59e0b' };
        const catIcons = { 'Food': '🍔', 'Transport': '🚗', 'Shopping': '🛍️', 'Bills': '📱' };

        function saveData() {
            localStorage.setItem('smartpulse_v2', JSON.stringify(state));
            updateUI();
        }

        function resetData() {
            if(confirm("Are you sure you want to reset all data and transactions?")) {
                state = JSON.parse(JSON.stringify(defaultState));
                saveData();
                switchTab('home');
            }
        }

        function toggleRoundups() {
            state.roundupsActive = document.getElementById('roundup-toggle').checked;
            saveData();
        }

        function updateUI() {
            // Update Text & Progress
            document.getElementById('display-balance').innerText = `$${state.balance.toFixed(2)}`;
            document.getElementById('goal-current').innerText = `$${state.goalCurrent.toFixed(2)}`;
            document.getElementById('roundup-toggle').checked = state.roundupsActive;
            
            const badge = document.getElementById('roundup-badge');
            if(state.roundupsActive) {
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            let progress = (state.goalCurrent / 500) * 100;
            document.getElementById('goal-progress').style.width = `${Math.min(progress, 100)}%`;

            // Render Transactions List
            const list = document.getElementById('transaction-list');
            list.innerHTML = '';
            
            if(state.transactions.length === 0) {
                list.innerHTML = '<p class="text-sm text-slate-400 text-center py-6 bg-slate-700/20 rounded-xl">No transactions yet. Add one above!</p>';
            }

            state.transactions.slice().reverse().forEach(tx => {
                list.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-700/40 p-4 rounded-2xl border border-slate-600/50 hover:bg-slate-700/60 transition-colors">
                        <div class="flex items-center gap-4">
                            <div class="bg-slate-800 text-xl w-12 h-12 flex items-center justify-center rounded-xl shadow-inner border border-slate-700">
                                ${catIcons[tx.category] || '💸'}
                            </div>
                            <div>
                                <p class="font-bold text-slate-200">${tx.category}</p>
                                <p class="text-xs text-slate-400">Success</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-bold text-white">-$${tx.amount.toFixed(2)}</p>
                            ${tx.roundup > 0 ? `<p class="text-[11px] text-indigo-400 mt-1 font-medium bg-indigo-500/10 px-2 py-0.5 rounded-full inline-block">+ $${tx.roundup.toFixed(2)} saved</p>` : ''}
                        </div>
                    </div>
                `;
            });

            updateAnalytics();
        }

        function addTransaction() {
            const amountInput = document.getElementById('expense-amount');
            const category = document.getElementById('expense-category').value;
            let amount = parseFloat(amountInput.value);

            if (isNaN(amount) || amount <= 0) return alert("Please enter a valid amount.");

            let roundup = 0;
            if(state.roundupsActive) {
                let roundedAmount = Math.ceil(amount);
                roundup = roundedAmount - amount;
                roundup = parseFloat(roundup.toFixed(2));
            }

            // Update State
            state.balance -= amount;
            if (roundup > 0) {
                state.balance -= roundup;
                state.goalCurrent += roundup;
            }

            state.transactions.push({ amount, category, roundup });
            
            amountInput.value = '';
            saveData();
        }

        function updateAnalytics() {
            const totals = {};
            let totalSpent = 0;

            state.transactions.forEach(tx => {
                totals[tx.category] = (totals[tx.category] || 0) + tx.amount;
                totalSpent += tx.amount;
            });

            // Update Category List in Analytics Tab
            const catList = document.getElementById('category-list');
            catList.innerHTML = '';
            
            if(totalSpent === 0) {
                catList.innerHTML = '<p class="text-center text-slate-400 text-sm mt-8">No spending data yet.</p>';
            }

            Object.keys(totals).sort((a,b) => totals[b] - totals[a]).forEach(cat => {
                let pct = ((totals[cat] / totalSpent) * 100).toFixed(0);
                catList.innerHTML += `
                    <div class="bg-slate-700/30 p-4 rounded-xl flex items-center justify-between border border-slate-600/30">
                        <div class="flex items-center gap-3">
                            <div class="w-3 h-3 rounded-full" style="background-color: ${catColors[cat]}"></div>
                            <span class="font-medium">${catIcons[cat]} ${cat}</span>
                        </div>
                        <div class="text-right">
                            <p class="font-bold">$${totals[cat].toFixed(2)}</p>
                            <p class="text-xs text-slate-400">${pct}% of spending</p>
                        </div>
                    </div>
                `;
            });

            // Draw/Update Chart
            const ctx = document.getElementById('spendChart').getContext('2d');
            
            const data = {
                labels: Object.keys(totals),
                datasets: [{
                    data: Object.values(totals),
                    backgroundColor: Object.keys(totals).map(c => catColors[c]),
                    borderWidth: 0,
                    hoverOffset: 4
                }]
            };

            if(spendChartInstance) {
                spendChartInstance.data = data;
                spendChartInstance.update();
            } else {
                spendChartInstance = new Chart(ctx, {
                    type: 'doughnut',
                    data: data,
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '75%',
                        plugins: {
                            legend: { display: false }
                        }
                    }
                });
            }
        }

        function switchTab(tabId) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            // Reset all nav buttons
            document.querySelectorAll('.nav-btn').forEach(el => {
                el.classList.remove('text-indigo-400');
                el.classList.add('text-slate-500');
            });

            // Show selected tab
            document.getElementById(`tab-${tabId}`).classList.add('active');
            
            // Highlight selected nav
            const activeNav = document.getElementById(`nav-${tabId}`);
            activeNav.classList.remove('text-slate-500');
            activeNav.classList.add('text-indigo-400');
        }

        // Initialize App
        updateUI();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPulse Banking</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex justify-center p-4 font-sans">

    <!-- Mobile App Container -->
    <div class="w-full max-w-md bg-slate-800 rounded-[2.5rem] shadow-2xl overflow-hidden border border-slate-700 relative">
        
        <!-- Header -->
        <div class="p-6 bg-slate-800 pb-2">
            <h1 class="text-2xl font-bold tracking-tight">SmartPulse</h1>
            <p class="text-slate-400 text-sm">Welcome back</p>
        </div>

        <!-- Dashboard Tab -->
        <div id="tab-dashboard" class="p-6 space-y-6">
            <!-- Balance Card -->
            <div class="bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl p-6 shadow-lg">
                <p class="text-indigo-100 text-sm font-medium mb-1">Available Balance</p>
                <h2 id="display-balance" class="text-4xl font-bold">$1,240.50</h2>
            </div>

            <!-- Savings Goal Widget -->
            <div class="bg-slate-700 rounded-2xl p-5 border border-slate-600">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-semibold">Spring Break Trip</h3>
                    <span class="text-xs bg-indigo-500/20 text-indigo-300 px-2 py-1 rounded-full border border-indigo-500/30">Round-Ups Active</span>
                </div>
                <div class="w-full bg-slate-800 rounded-full h-2.5 mb-2">
                    <div id="goal-progress" class="bg-indigo-400 h-2.5 rounded-full" style="width: 0%"></div>
                </div>
                <p class="text-sm text-slate-400"><span id="goal-current" class="text-white font-medium">$0.00</span> / $500.00</p>
            </div>

            <!-- Add Transaction -->
            <div>
                <h3 class="font-semibold mb-3">Quick Add Expense</h3>
                <div class="flex gap-2">
                    <input type="number" id="expense-amount" placeholder="$ Amount" class="bg-slate-700 border border-slate-600 text-white text-sm rounded-xl px-3 py-2 w-full focus:outline-none focus:border-indigo-500">
                    <select id="expense-category" class="bg-slate-700 border border-slate-600 text-white text-sm rounded-xl px-3 py-2 focus:outline-none">
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Shopping">Shopping</option>
                    </select>
                    <button onclick="addTransaction()" class="bg-indigo-500 hover:bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-medium transition-colors">Add</button>
                </div>
            </div>

            <!-- Recent Transactions Feed -->
            <div>
                <h3 class="font-semibold mb-3">Recent Transactions</h3>
                <div id="transaction-list" class="space-y-3">
                    <!-- Transactions injected here by JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // State Management using LocalStorage
        let state = JSON.parse(localStorage.getItem('smartpulse_data')) || {
            balance: 1240.50,
            goalCurrent: 0.00,
            transactions: []
        };

        function saveData() {
            localStorage.setItem('smartpulse_data', JSON.stringify(state));
            updateUI();
        }

        function updateUI() {
            document.getElementById('display-balance').innerText = `$${state.balance.toFixed(2)}`;
            document.getElementById('goal-current').innerText = `$${state.goalCurrent.toFixed(2)}`;
            
            // Calculate progress bar
            let progress = (state.goalCurrent / 500) * 100;
            document.getElementById('goal-progress').style.width = `${Math.min(progress, 100)}%`;

            // Render Transactions
            const list = document.getElementById('transaction-list');
            list.innerHTML = '';
            
            if(state.transactions.length === 0) {
                list.innerHTML = '<p class="text-sm text-slate-400 text-center py-4">No recent transactions.</p>';
            }

            state.transactions.slice().reverse().forEach(tx => {
                list.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-700/50 p-3 rounded-xl border border-slate-600/50">
                        <div class="flex items-center gap-3">
                            <div class="bg-slate-600 p-2 rounded-lg">
                                🍔
                            </div>
                            <div>
                                <p class="font-medium text-sm">${tx.category}</p>
                                <p class="text-xs text-slate-400">Just now</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-semibold text-sm">-$${tx.amount.toFixed(2)}</p>
                            ${tx.roundup > 0 ? `<p class="text-xs text-indigo-400">+$${tx.roundup.toFixed(2)} saved</p>` : ''}
                        </div>
                    </div>
                `;
            });
        }

        function addTransaction() {
            const amountInput = document.getElementById('expense-amount');
            const category = document.getElementById('expense-category').value;
            let amount = parseFloat(amountInput.value);

            if (isNaN(amount) || amount <= 0) return alert("Enter a valid amount");

            // Calculate Round-Up (Nearest Dollar)
            let roundedAmount = Math.ceil(amount);
            let roundup = roundedAmount - amount;

            // Prevent precision errors (e.g., 0.00000001)
            roundup = parseFloat(roundup.toFixed(2));

            // Update State
            state.balance -= amount;
            
            if (roundup > 0) {
                state.balance -= roundup;
                state.goalCurrent += roundup;
            }

            state.transactions.push({ amount, category, roundup });
            
            // Clear input and save
            amountInput.value = '';
            saveData();
        }

        // Initial Render
        updateUI();
    </script>
</body>
</html>
